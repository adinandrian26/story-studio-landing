name: "Film dari HP"

# Buat film Story Studio dari HP (laptop boleh mati):
# buka github.com/adinandrian26/story-studio-landing/actions -> pilih
# "Film dari HP" -> Run workflow -> isi judul (+ tema & jumlah adegan) -> Run.
# Judul masuk antrean aman (secret gist) + konfirmasi WA ke penjual.
# Aplikasi Story Studio di PC penjual memproses antrean OTOMATIS begitu
# menyala (naskah -> pemeran -> gambar; laporan tiap tahap via notif-wa).

on:
  workflow_dispatch:
    inputs:
      judul:
        description: "Judul film (wajib)"
        required: true
        type: string
      tema:
        description: "Tema karakter: F-REAL (realistis) | F-STICK (stickman) | F-3D (animasi 3D)"
        required: false
        default: "F-REAL"
        type: string
      scene:
        description: "Jumlah adegan (3-12)"
        required: false
        default: "8"
        type: string

concurrency:
  group: film-dari-hp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  antre:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Masukkan ke antrean + WA konfirmasi
        env:
          GH_TOKEN: ${{ github.token }}
          # Gist tidak bisa ditulis GITHUB_TOKEN (403) — pakai PAT pribadi
          # ber-scope gist yang disimpan sebagai secret MOBILE_QUEUE_TOKEN.
          GIST_TOKEN: ${{ secrets.MOBILE_QUEUE_TOKEN }}
          GIST_ID: "fa88cead8067c2e3c5a527d9d658583b"
          JUDUL: ${{ inputs.judul }}
          TEMA: ${{ inputs.tema }}
          SCENE: ${{ inputs.scene }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_PENJUAL: "6289634589191"
        run: python .github/akses_tools/queue_film.py
